name: ci

on:
  push:
    branches: [main]
    paths:
      - "sidecar/**"
      - "pip/**"
      - "internal/**"
      - "integration/**"
      - "contracts/**"
      - "features/**"
      - "deploy/**"
      - "hack/**"
      - "tools/**"
      - "docs/**"
      - "examples/**"
      - "deploy/sidecar/**"
      - "go.mod"
      - "Makefile"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "sidecar/**"
      - "pip/**"
      - "internal/**"
      - "integration/**"
      - "contracts/**"
      - "features/**"
      - "deploy/**"
      - "hack/**"
      - "tools/**"
      - "docs/**"
      - "examples/**"
      - "deploy/sidecar/**"
      - "go.mod"
      - "Makefile"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: govulncheck
        run: make vulncheck
      - name: test
        run: make test
      - name: race
        run: go test -race ./...
      - name: bdd acceptance criteria
        run: make acceptance
      - name: build
        run: make build
      - name: registry openapi gate
        run: make openapi-gate
      - name: validate contracts
        run: |
          python3 - <<'PY'
          import json, glob, sys
          for path in glob.glob("contracts/*.json"):
              json.load(open(path))
              print("ok", path)
          PY

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: sample contract tests
        run: make examples

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: repository steward
        run: make steward

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: lint
        run: helm lint deploy/helm/controls-plane
      - name: render defaults
        run: helm template controls deploy/helm/controls-plane --namespace controls >/dev/null
      - name: sidecar library dependency
        run: helm dependency build deploy/examples/sidecar-service
      - name: render sidecar library example
        run: helm template sidecar deploy/examples/sidecar-service >/dev/null
      - name: render istio
        run: |
          helm template controls deploy/helm/controls-plane --namespace controls             --set istio.enabled=true             --set 'istio.authorizationPolicy.allowedPrincipals[0]=cluster.local/ns/app/sa/sidecar' >/dev/null

  smoke:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: live envoy smoke test
        run: make smoke
