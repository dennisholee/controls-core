<text x="912" y="752" class="small" text-anchor="start" >authz (optional)</text>
<rect x="1225" y="205" width="335" height="520" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="1245" y="235" class="h3" text-anchor="start" >Delivery pipeline</text>
<text x="1245" y="255" class="small" text-anchor="start" >Jenkins, pinned tools</text>
<text x="1245" y="545" class="small" text-anchor="start" >pinned by digest</text>
<text x="1245" y="568" class="small" text-anchor="start" >rollback: previous bundle</text>
<text x="1245" y="591" class="small" text-anchor="start" >OPA policy: separate</text>
<rect x="1245" y="275" width="295" height="55" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
<text x="1263" y="298" class="card" text-anchor="start" >Jenkins</text>
<text x="1263" y="318" class="small" text-anchor="start" >render · validate · sign</text>
<path d="M1392 330 V355" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="1245" y="355" width="295" height="55" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
<text x="1263" y="378" class="card" text-anchor="start" >Signed bundle@digest</text>
<text x="1263" y="398" class="small" text-anchor="start" >manifest.sig + registry</text>
