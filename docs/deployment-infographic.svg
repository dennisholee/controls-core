<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" role="img" aria-labelledby="t d">
<title id="t">Controls Plane deployment topology</title>
<desc id="d">Kubernetes deployment topology with gateway, app and controls namespaces, sidecar injection, PIP replicas across zones, NetworkPolicies, bundle ConfigMap and delivery pipeline.</desc>
<rect width="1600" height="1320" fill="#f4f7fb"/>
<rect width="1600" height="8" fill="#0f766e"/>
<defs>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
</defs>
<style>
text{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#132238}
.h1{font-size:38px;font-weight:800;letter-spacing:-.5px}
.sub{font-size:16px;fill:#475569}
.h2{font-size:24px;font-weight:800}
.h3{font-size:18px;font-weight:750}
.card{font-size:16px;font-weight:750}
.body{font-size:13.5px;fill:#475569}
.small{font-size:11.5px;fill:#64748b}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;fill:#1e293b}
.badge{font-size:11px;font-weight:700}
</style>
<text x="60" y="62" class="h1" text-anchor="start" >Deployment topology</text>
<text x="60" y="92" class="sub" text-anchor="start" >Where the components run: namespaces, network boundaries, bundle mounts, PIP replicas and delivery.</text>
<rect x="1360" y="38" width="180" height="34" rx="17" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5" />
<text x="1450" y="60" class="badge" text-anchor="middle" style="fill:#0f766e">v0.39.0</text>
<rect x="90" y="140" width="160" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
<text x="170" y="170" class="card" text-anchor="middle" >Client</text>
<path d="M170 190 V280" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#arrow)"/>
<rect x="60" y="205" width="1140" height="1015" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="8 6" />
<text x="85" y="232" class="h2" text-anchor="start" >Kubernetes cluster</text>
<text x="85" y="254" class="small" text-anchor="start" >namespaces + network policies + workload identity</text>
<rect x="90" y="275" width="1080" height="125" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.4" />
<text x="110" y="300" class="h3" text-anchor="start" >gateway namespace</text>
<rect x="110" y="315" width="320" height="65" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.3" />
<text x="128" y="340" class="card" text-anchor="start" >Gateway pods</text>
<text x="128" y="360" class="small" text-anchor="start" >authn · route authz · strips client headers</text>
<rect x="460" y="315" width="380" height="65" rx="10" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.3" />
<text x="478" y="340" class="card" text-anchor="start" >NetworkPolicy</text>
<text x="478" y="360" class="small" text-anchor="start" >client → gateway only</text>
<text x="900" y="340" class="small" text-anchor="start" >no direct app access</text>
<rect x="90" y="420" width="1080" height="315" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" />
<text x="110" y="445" class="h3" text-anchor="start" >app namespace</text>
<rect x="110" y="460" width="760" height="190" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="5 4" />
<text x="128" y="482" class="card" text-anchor="start" >Service Deployment</text>
<text x="128" y="500" class="small" text-anchor="start" >one pod per replica</text>
<rect x="128" y="515" width="330" height="120" rx="10" fill="#ecfdf5" stroke="#34d399" stroke-width="1.4" />
<text x="146" y="540" class="card" text-anchor="start" >Envoy + ext_proc</text>
<text x="146" y="562" class="body" text-anchor="start" >registry.json match</text>
<text x="146" y="580" class="body" text-anchor="start" >PIP attrs + policy</text>
<text x="146" y="598" class="body" text-anchor="start" >DQ + response mask</text>
<rect x="500" y="515" width="330" height="120" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.4" />
<text x="518" y="540" class="card" text-anchor="start" >Spring Boot</text>
<text x="518" y="562" class="body" text-anchor="start" >business logic</text>
<text x="518" y="580" class="body" text-anchor="start" >raw JSON response</text>
<text x="518" y="598" class="body" text-anchor="start" >not published</text>
<path d="M458 575 H500" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow)"/>
<path d="M500 600 H458" fill="none" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="900" y="460" width="250" height="95" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.4" />
<text x="918" y="484" class="card" text-anchor="start" >ConfigMap</text>
<text x="918" y="504" class="body" text-anchor="start" >signed bundle</text>
<text x="918" y="522" class="small" text-anchor="start" >registry/rules/masks/dq</text>
<rect x="900" y="570" width="250" height="80" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.4" />
<text x="918" y="594" class="card" text-anchor="start" >Secret</text>
<text x="918" y="614" class="small" text-anchor="start" >identity · audit · pubkey</text>
<path d="M900 505 H860" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="880" y="492" class="small" text-anchor="middle" >mount</text>
<rect x="110" y="660" width="760" height="55" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" />
<text x="128" y="682" class="small" text-anchor="start" >NetworkPolicy: gateway → sidecar · sidecar → PIP · monitoring → metrics</text>
<text x="128" y="700" class="small" text-anchor="start" >app port is never exposed; only the sidecar listener is published</text>
<rect x="90" y="750" width="1080" height="235" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.4" />
<text x="110" y="775" class="h3" text-anchor="start" >controls namespace</text>
<rect x="110" y="790" width="250" height="90" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3" />
<text x="128" y="814" class="card" text-anchor="start" >PIP replica · zone A</text>
<text x="128" y="836" class="small" text-anchor="start" >2+ replicas</text>
<text x="128" y="854" class="small" text-anchor="start" >PDB minAvailable 1</text>
<text x="128" y="872" class="small" text-anchor="start" >contract v1.0</text>
<rect x="380" y="790" width="250" height="90" rx="10" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.3" />
<text x="398" y="814" class="card" text-anchor="start" >PIP replica · zone B</text>
<text x="398" y="836" class="small" text-anchor="start" >anti-affinity spread</text>
<text x="398" y="854" class="small" text-anchor="start" >mTLS + caller auth</text>
<rect x="110" y="895" width="520" height="40" rx="10" fill="#ddd6fe" stroke="#a78bfa" stroke-width="1.2" />
<text x="128" y="920" class="card" text-anchor="start" >PIP Service :8082</text>
<rect x="110" y="945" width="520" height="30" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
<text x="128" y="965" class="badge" text-anchor="start" style="fill:#991b1b">PIP / OPA error → fail closed</text>
<rect x="690" y="790" width="200" height="90" rx="10" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3" />
<text x="708" y="814" class="card" text-anchor="start" >OPA (optional)</text>
<text x="708" y="836" class="small" text-anchor="start" >external Rego</text>
<text x="708" y="854" class="small" text-anchor="start" >not in bundle</text>
<rect x="910" y="790" width="240" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" />
<text x="928" y="814" class="card" text-anchor="start" >Sources + TLS</text>
<text x="928" y="836" class="small" text-anchor="start" >read APIs / replicas</text>
<text x="928" y="854" class="small" text-anchor="start" >PIP client certs</text>
<rect x="90" y="1000" width="1080" height="200" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.4" />
<text x="110" y="1025" class="h3" text-anchor="start" >monitoring + data plane</text>
<rect x="110" y="1040" width="300" height="90" rx="10" fill="#ccfbf1" stroke="#2dd4bf" stroke-width="1.3" />
<text x="128" y="1064" class="card" text-anchor="start" >Prometheus</text>
<text x="128" y="1086" class="small" text-anchor="start" >scrapes :9090</text>
<rect x="450" y="1040" width="360" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3" />
<text x="468" y="1064" class="card" text-anchor="start" >Read APIs / replicas</text>
<text x="468" y="1086" class="small" text-anchor="start" >per-domain read-only access</text>
<text x="468" y="1104" class="small" text-anchor="start" >attributes + lag header</text>
<rect x="850" y="1040" width="290" height="90" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3" />
<text x="868" y="1064" class="card" text-anchor="start" >Audit / log sink</text>
<text x="868" y="1086" class="small" text-anchor="start" >hashed decisions</text>
<text x="868" y="1104" class="small" text-anchor="start" >stdout / -audit-out</text>
