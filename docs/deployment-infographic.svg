<text x="1263" y="458" class="card" text-anchor="start" >ConfigMap</text>
<text x="1263" y="478" class="small" text-anchor="start" >mounted into the pod</text>
<path d="M1245 462 H1170 Q1160 462 1160 472 V495 Q1160 505 1150 505" fill="none" stroke="#7c3aed" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1200" y="452" class="small" text-anchor="middle" >deploy</text>
<text x="60" y="1280" class="small" text-anchor="start" >Solid = traffic · dashed = optional · PDB/anti-affinity = PIP availability · app port never exposed</text>
