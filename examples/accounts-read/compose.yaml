name: controls-example-accounts
services:
  app:
    image: accounts-read-app:dev
    expose:
      - "8080"
  pip:
    image: accounts-read-pip:dev
    expose:
      - "8082"
  sidecar:
    image: controls-sidecar:dev
    ports:
      - "18000:8080"
    environment:
      PIP_URL: http://pip:8082
      CONTROLS_AUDIT_SALT: sample-salt
      SERVICE_NAME: accounts
    volumes:
      - ./controls:/etc/controls/bundle:ro
      - ./envoy/envoy.yaml:/etc/controls/envoy.yaml:ro
    depends_on:
      - app
      - pip
