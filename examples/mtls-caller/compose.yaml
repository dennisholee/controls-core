name: controls-example-mtls
services:
  app:
    image: mtls-caller-app:dev
    expose:
      - "8080"
  attribute-api:
    image: mtls-caller-app:dev
    expose:
      - "8080"
  pip:
    image: mtls-caller-pip:dev
    entrypoint: ["/usr/local/bin/pip"]
    command: ["-runtime-config", "/etc/controls/pip.yaml"]
    expose:
      - "8082"
    volumes:
      - ./certs:/tls:ro
      - ./pip/sources.json:/etc/controls/sources.json:ro
      - ./pip/pip.yaml:/etc/controls/pip.yaml:ro
  sidecar:
    image: controls-sidecar:dev
    ports:
      - "18004:8080"
    environment:
      CONTROLS_RUNTIME_CONFIG: /etc/controls/sidecar.yaml
      SERVICE_NAME: mtls-caller
    volumes:
      - ./controls:/etc/controls/bundle:ro
      - ./envoy/envoy.yaml:/etc/controls/envoy.yaml:ro
      - ./certs:/etc/controls/pip-tls:ro
      - ./sidecar.yaml:/etc/controls/sidecar.yaml:ro
    depends_on:
      - app
      - pip
