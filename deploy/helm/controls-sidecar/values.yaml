# Defaults for the sidecar library. Parent charts override these.
envoy:
  image: envoyproxy/envoy:v1.40.0
  pullPolicy: IfNotPresent
  port: 8080
  adminPort: 9901
  resources: {}

extproc:
  image: controls-extproc:0.41.0
  pullPolicy: IfNotPresent
  port: 50051
  metricsPort: 9090
  resources: {}
  pipURL: http://controls-pip.controls.svc:8082
  pipAPIVersion: "1.0"
  pipTimeout: 100ms
  pipDefaultTTL: 30s
  maxTTL: 5m
  pipMaxCache: 100000
  pipBreakerCooldown: 5s
  identityMaxSkew: 1m
  reloadInterval: 30s
  # Optional external OPA decision endpoint.
  opaURL: ""
  opaTimeout: 100ms
  # When true, the container reads /etc/controls/runtime/sidecar.yaml instead
  # of the flag set below. The parent chart must include
  # controls-sidecar.configmap and the runtime-config volume.
  runtimeConfig: false
  runtimeConfigMap: controls-runtime-config
  # Optional PIP mTLS files, mounted from the shared secrets volume.
  pipCA: ""
  pipCert: ""
  pipKey: ""
  pipServerName: ""
  # Development only; production must leave this false and provide a pubkey.
  allowUnsigned: false
  auditSample: "0.01"
  auditBuffer: "4096"
  # Optional dedicated audit file (parent must mount the path). Empty = stdout.
  auditOut: ""

volumes:
  envoyConfig: controls-envoy-config
  bundle: controls-bundle
  secrets: controls-secrets

secrets:
  auditSaltKey: audit-salt
  identityKey: identity-hmac
  bundlePubKey: public-key.pem
