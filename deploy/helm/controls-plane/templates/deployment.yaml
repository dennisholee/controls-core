{{- if .Values.pip.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controls-plane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controls-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.pip.replicas }}
  selector:
    matchLabels:
      {{- include "controls-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controls-plane.selectorLabels" . | nindent 8 }}
        {{- with .Values.pip.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.pip.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Values.pip.serviceAccount.name | default (include "controls-plane.fullname" .) }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pip
          image: "{{ .Values.pip.image }}:{{ .Values.pip.tag }}"
          imagePullPolicy: {{ .Values.pip.pullPolicy }}
          args:
            - -addr
            - ":{{ .Values.pip.port }}"
            {{- if .Values.pip.fixtures.enabled }}
            - -fixtures
            - /etc/controls/attributes.json
            {{- end }}
            {{- if .Values.pip.sources.enabled }}
            - -sources
            - /etc/controls-sources/sources.json
            {{- end }}
            - -lag-seconds
            - "{{ .Values.pip.lagSeconds }}"
            - -metrics-addr
            - ":{{ .Values.pip.metricsPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.pip.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.pip.metricsPort }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.pip.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.pip.resources | nindent 12 }}
          {{- if or .Values.pip.fixtures.enabled .Values.pip.sources.enabled .Values.pip.extraVolumeMounts }}
          volumeMounts:
            {{- if .Values.pip.fixtures.enabled }}
            - name: fixtures
              mountPath: /etc/controls
              readOnly: true
            {{- end }}
            {{- if .Values.pip.sources.enabled }}
            - name: sources
              mountPath: /etc/controls-sources
              readOnly: true
            {{- end }}
            {{- with .Values.pip.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.pip.fixtures.enabled .Values.pip.sources.enabled .Values.pip.extraVolumes }}
      volumes:
        {{- if .Values.pip.fixtures.enabled }}
        - name: fixtures
          configMap:
            name: {{ include "controls-plane.fullname" . }}-fixtures
        {{- end }}
        {{- if .Values.pip.sources.enabled }}
        - name: sources
          configMap:
            name: {{ include "controls-plane.fullname" . }}-sources
        {{- end }}
        {{- with .Values.pip.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.pip.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pip.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pip.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
