{{- if and .Values.istio.enabled .Values.istio.peerAuthentication.enabled .Values.pip.enabled }}
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: {{ include "controls-plane.fullname" . }}-pip
  labels:
    {{- include "controls-plane.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "controls-plane.selectorLabels" . | nindent 6 }}
  mtls:
    mode: {{ .Values.istio.peerAuthentication.mode }}
{{- end }}
