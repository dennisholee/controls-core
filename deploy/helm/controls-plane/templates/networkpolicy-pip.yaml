{{- if and .Values.networkPolicy.enabled .Values.pip.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "controls-plane.fullname" . }}-pip
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controls-plane.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "controls-plane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            {{- if .Values.networkPolicy.pip.sidecarNamespaceSelector }}
            {{- toYaml .Values.networkPolicy.pip.sidecarNamespaceSelector | nindent 12 }}
            {{- else }}
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
            {{- end }}
          podSelector:
            {{- toYaml .Values.networkPolicy.pip.sidecarPodSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.pip.port }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.pip.metricsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.pip.metricsPort }}
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.pip.egress.databaseCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.pip.egress.databasePort }}
    {{- end }}
    {{- with .Values.pip.egress.extraPeers }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
