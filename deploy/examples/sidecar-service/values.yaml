replicaCount: 2
cluster: accounts
envoy:
  image: envoyproxy/envoy:v1.40.0
extproc:
  image: controls-extproc:0.39.0
  pipURL: http://controls-pip.controls.svc:8082
  runtimeConfig: true
volumes:
  envoyConfig: accounts-envoy
  bundle: accounts-controls-bundle
  secrets: accounts-controls-secrets
secrets:
  auditSaltKey: audit-salt
  identityKey: identity-hmac
  bundlePubKey: public-key.pem
